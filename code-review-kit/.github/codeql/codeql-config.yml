# CodeQL 查詢設定（供 02-codeql.yml 的 config-file 使用）
#
# default setup 只能用 default / security-extended；
# security-and-quality 屬於非預設 suite，必須走 advanced setup（也就是這個檔案）。

name: 'CodeQL config'

queries:
  - uses: security-and-quality # 安全 + 程式碼品質查詢

paths-ignore:
  - '**/node_modules'
  - '**/dist'
  - '**/build'
  - '**/*.min.js'
  - '**/*.test.*'
  - '**/vendor/**'

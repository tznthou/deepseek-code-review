# 03 — AI review 第一段：**不受信任**、零 secret
#
# 這是 fork PR 安全架構的前半段。它只做「產生資料」：
#   checkout → 產出 diff/metadata → 上傳 artifact
# 完全不接觸任何 secret，所以即使 PR 來自 fork 也沒關係。
#
# 後半段（真正呼叫模型、貼留言）在 04-ai-review-post.yml，由 workflow_run 觸發。

name: 03 ai review collect

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# fork PR 本來就只有 read-only token，這裡明確寫出來當作文件
permissions:
  contents: read

concurrency:
  group: ai-review-collect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 產生 diff 與 metadata（只做資料處理，不執行 PR 的程式碼）
        run: |
          mkdir -p out
          BASE='${{ github.event.pull_request.base.sha }}'
          git diff --unified=3 "$BASE"...HEAD > out/pr.diff || true

          # 成本護欄：限制送進模型的資料量（模型是 1M context，但沒必要全送）
          head -c 400000 out/pr.diff > out/pr.diff.tmp && mv out/pr.diff.tmp out/pr.diff

          cat > out/meta.json <<EOF
          {
            "number": ${{ github.event.pull_request.number }},
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "base_ref": ${{ toJSON(github.event.pull_request.base.ref) }},
            "head_repo": ${{ toJSON(github.event.pull_request.head.repo.full_name) }},
            "title": ${{ toJSON(github.event.pull_request.title) }},
            "changed_files": ${{ github.event.pull_request.changed_files }},
            "additions": ${{ github.event.pull_request.additions }},
            "deletions": ${{ github.event.pull_request.deletions }}
          }
          EOF

          echo "diff bytes: $(wc -c < out/pr.diff)"
          echo "changed files: ${{ github.event.pull_request.changed_files }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ai-review-input
          path: out/
          retention-days: 1

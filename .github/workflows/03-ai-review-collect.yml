# 03 — AI review 第一段：**不受信任**、零 secret
#
# 這是 fork PR 安全架構的前半段。它只做「產生資料」：
#   checkout → 產出 diff/metadata → 上傳 artifact
# 完全不接觸任何 secret，所以即使 PR 來自 fork 也沒關係。
#
# 後半段（真正呼叫模型、貼留言）在 04-ai-review-post.yml，由 workflow_run 觸發。

name: 03 ai review collect

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# fork PR 本來就只有 read-only token，這裡明確寫出來當作文件
permissions:
  contents: read

concurrency:
  group: ai-review-collect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 產生 diff 與 metadata（只做資料處理，不執行 PR 的程式碼）
        run: |
          mkdir -p out
          BASE='${{ github.event.pull_request.base.sha }}'
          git diff --unified=3 "$BASE"...HEAD > out/pr.diff || true

          # 成本護欄：限制送進模型的資料量（模型是 1M context，但沒必要全送）
          #
          # ⚠️ 不要用 `head -c`：那是**位元組**截斷。2026-09-20 實測兩種損壞：
          #   * 最後一個 hunk **必然**被切成半截（實測尾行只剩一個 `+`）
          #   * UTF-8 字元有 **2/3 機率**被切斷（3-byte 中文，三種對齊裡兩種壞）
          # 兩者都是把壞掉的輸入交給下游。這裡改在 `diff --git` 邊界切，
          # 保留整數個檔案區塊——與 `deepseek_review.py` 的 `truncate()` 同一個判準。
          python3 - <<'TRUNC'
          import pathlib
          LIMIT = 400_000
          p = pathlib.Path('out/pr.diff')
          raw = p.read_bytes()
          if len(raw) > LIMIT:
              cut = raw.rfind(b'\ndiff --git ', 0, LIMIT)
              kept = raw[:cut + 1] if cut > 0 else raw[:LIMIT]
              p.write_bytes(kept + b'\n[truncated] diff exceeded 400000 bytes\n')
              print(f'[warn] diff {len(raw)} bytes -> {len(kept)} bytes (在檔案邊界截斷)')
          TRUNC

          cat > out/meta.json <<EOF
          {
            "number": ${{ github.event.pull_request.number }},
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "base_ref": ${{ toJSON(github.event.pull_request.base.ref) }},
            "head_repo": ${{ toJSON(github.event.pull_request.head.repo.full_name) }},
            "title": ${{ toJSON(github.event.pull_request.title) }},
            "changed_files": ${{ github.event.pull_request.changed_files }},
            "additions": ${{ github.event.pull_request.additions }},
            "deletions": ${{ github.event.pull_request.deletions }}
          }
          EOF

          echo "diff bytes: $(wc -c < out/pr.diff)"
          echo "changed files: ${{ github.event.pull_request.changed_files }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ai-review-input
          path: out/
          retention-days: 1

# 03 — AI review 第一段：**不受信任**、零 secret
#
# ⭐ 2026-09-21 起這支改成 caller —— 實作在 reusable-ai-review-collect.yml，
#    本 repo 自己也走一般使用者的路徑（dogfood）。導入方式見 USAGE.md。
#
# 這是 fork PR 安全架構的前半段。它只做「產生資料」：
#   checkout → 產出 diff/metadata → 上傳 artifact
# 完全不接觸任何 secret，所以即使 PR 來自 fork 也沒關係。
#
# 後半段（真正呼叫模型、貼留言）在 04-ai-review-post.yml，由 workflow_run 觸發。
# ⚠️ 那支是靠**本檔的 name:** 來認人的，改名字要同步改 04。

name: 03 ai review collect

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# fork PR 本來就只有 read-only token，這裡明確寫出來當作文件
permissions:
  contents: read

jobs:
  collect:
    # 用 @v1 而不是 ./ 相對路徑：相對路徑會繞過跨 repo 的載入機制，
    # 而本 repo 存在的意義之一就是驗證那條路徑對外部使用者可用。
    uses: tznthou/deepseek-code-review/.github/workflows/reusable-ai-review-collect.yml@v1

# 可重用版的 03 —— AI review 第一段：**不受信任**、零 secret。
#
# 給別的 repo 這樣引用：
#
#   jobs:
#     collect:
#       uses: tznthou/deepseek-code-review/.github/workflows/reusable-ai-review-collect.yml@v1
#
# 這一段只做「產生資料」：checkout → 產出 diff/metadata → 上傳 artifact。
# 完全不接觸任何 secret，所以 fork PR 也安全。
# 真正呼叫模型、貼留言的是 reusable-ai-review-post.yml，由 workflow_run 觸發。
#
# 注意：這支**不需要** checkout 本 kit —— 它用的全是呼叫方 repo 自己的資料。

name: reusable ai review collect

on:
  workflow_call:
    inputs:
      max-diff-bytes:
        description: 送進模型的 diff 上限（在檔案邊界截斷，不會切半個 hunk）
        required: false
        type: number
        default: 400000
      skip-draft:
        description: draft PR 是否跳過
        required: false
        type: boolean
        default: true
      artifact-name:
        description: artifact 名稱。改了的話 post 段要傳一樣的值
        required: false
        type: string
        default: ai-review-input

permissions:
  contents: read

jobs:
  collect:
    if: inputs.skip-draft == false || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 產生 diff 與 metadata（只做資料處理，不執行 PR 的程式碼）
        env:
          LIMIT: ${{ inputs.max-diff-bytes }}
          # 攻擊者可控的值一律走環境變數，不要進 inline script 的展開路徑
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          mkdir -p out
          BASE='${{ github.event.pull_request.base.sha }}'

          # ⚠️ 這支只在「呼叫方由 pull_request 事件觸發」時才有意義。
          # 若 caller 是 workflow_dispatch / push 之類，`github.event.pull_request` 是 null，
          # BASE 會是空字串，而 `git diff ...HEAD` 是合法語法（等同 HEAD...HEAD）→ **空 diff**。
          # 舊版這裡還配了 `|| true`，等於把這個情況變成「安靜地產出空 review」。
          # 寧可在這裡 fail fast，也不要讓下游拿著空 diff 去燒 API token。
          if [ -z "$BASE" ]; then
            echo "::error::取不到 PR 的 base SHA。這支 reusable workflow 必須由 pull_request 事件觸發的 caller 呼叫；目前的事件是 '${{ github.event_name }}'。"
            exit 1
          fi
          # 注意：不要寫成 "$BASE^{commit}" —— 那個 }^{ 序列會被 Actions 的
          # expression 解析器誤判，actionlint 會報 unexpected token
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::error::base SHA ${BASE} 不在這個 repo 的歷史裡。checkout 需要 fetch-depth: 0。"
            exit 1
          fi

          # 前面兩道已經把「取不到 base」擋掉了，這裡不再用 `|| true` 吞錯誤
          git diff --unified=3 "$BASE"...HEAD > out/pr.diff

          if [ ! -s out/pr.diff ]; then
            echo "::warning::diff 是空的（base 與 head 之間沒有差異）。後續的 AI review 不會有東西可看。"
          fi

          # 成本護欄。⚠️ 不要用 `head -c`：那是**位元組**截斷，2026-09-20 實測兩種損壞：
          #   * 最後一個 hunk 必然被切成半截
          #   * UTF-8 字元有 2/3 機率被切斷（3-byte 中文，三種對齊裡兩種壞）
          # 這裡在 `diff --git` 邊界切，保留整數個檔案區塊。
          python3 - <<'TRUNC'
          import os, pathlib
          LIMIT = int(os.environ['LIMIT'])
          p = pathlib.Path('out/pr.diff')
          raw = p.read_bytes()
          if len(raw) > LIMIT:
              cut = raw.rfind(b'\ndiff --git ', 0, LIMIT)
              kept = raw[:cut + 1] if cut > 0 else raw[:LIMIT]
              p.write_bytes(kept + b'\n[truncated] diff exceeded %d bytes\n' % LIMIT)
              print(f'[warn] diff {len(raw)} bytes -> {len(kept)} bytes (在檔案邊界截斷)')
          TRUNC

          # ⚠️ PR 標題與分支名是**攻擊者可控**的字串。
          # 舊版用不帶引號的 heredoc（`<<EOF`）直接內插 toJSON() 的展開結果——
          # toJSON 只做 JSON 跳脫，**擋不住 shell 的命令替換**：標題若是 `$(whoami)`，
          #
          # 另注意：這段註解裡不要寫出完整的 Actions expression 語法（雙大括號那個），
          # run block 裡的 `#` 只是 shell 註解，expression 仍然會被解析——寫了會 parse error。
          # 展開後那段會在 heredoc 裡被執行。任何人開一個 PR 就能觸發。
          # 這裡改成「值走環境變數、JSON 由 Python 產生」，`<<'PY'` 帶引號所以完全不展開。
          python3 - <<'PY'
          import json, os
          meta = {
              "number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["PR_HEAD_SHA"],
              "base_ref": os.environ["PR_BASE_REF"],
              "head_repo": os.environ["PR_HEAD_REPO"],
              "title": os.environ["PR_TITLE"],
              "changed_files": int(os.environ["PR_CHANGED_FILES"]),
              "additions": int(os.environ["PR_ADDITIONS"]),
              "deletions": int(os.environ["PR_DELETIONS"]),
          }
          with open("out/meta.json", "w", encoding="utf-8") as fh:
              json.dump(meta, fh, ensure_ascii=False, indent=2)
          PY

          echo "diff bytes: $(wc -c < out/pr.diff)"
          echo "changed files: $PR_CHANGED_FILES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: out/
          retention-days: 1

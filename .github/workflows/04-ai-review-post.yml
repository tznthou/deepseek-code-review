# 04 — AI review 第二段：**受信任**、持有 secret
#
# ⭐ 2026-09-21 起這支改成 caller —— 實作在 reusable-ai-review-post.yml，
#    本 repo 自己也走一般使用者的路徑（dogfood）。導入方式見 USAGE.md。
#
# 由 workflow_run 觸發。關鍵性質：
#   * 執行的是「default branch 上的這份 workflow 檔」→ PR 無法修改它
#   * 拿得到 secrets 與可寫的 GITHUB_TOKEN
#   * **只下載 artifact（資料），永不 checkout fork 的 head**
#
# 因此 fork PR 也能安全地跑 AI review。
#
# 需要的 repo secret：
#   DEEPSEEK_API_KEY   （https://platform.deepseek.com/api_keys）
#
# ⚠️ 改成 caller 之後失去的一項能力：舊版可以打開 `environment: ai-review` 做
#    「貼留言前人工核可」。caller 的 job 用 `uses:` 時不能同時設 `environment:`，
#    而 reusable 版目前沒有對應的 input。需要人工核可就得改回內嵌實作，
#    或替 reusable-ai-review-post.yml 補一個 environment input。

name: 04 ai review post

on:
  workflow_run:
    workflows: ['03 ai review collect'] # ⚠️ 必須與 03 的 name: 完全一致
    types: [completed]

# ⚠️ 這段不能省：被呼叫的 workflow 拿不到超過呼叫方的權限。
# 沒宣告就用 repo 預設（通常 read-only），reusable 裡要 write 會整個 startup_failure，
# 而 actionlint 驗不出來、--log-failed 也是空的。
permissions:
  contents: read
  pull-requests: write # 貼 review comment
  actions: read # 下載上一段的 artifact

jobs:
  # ⚠️⚠️ 2026-09-21 信任邊界測試用，**不要 merge**。⚠️⚠️
  #
  # 這個 job 只存在於測試分支，default branch 的版本沒有它。
  # workflow_run 若照文件所說跑 default branch 的檔案，它永遠不會被執行。
  # 一旦 base repo 的 04 run 裡出現這個 job，代表 PR 可以改寫受信任段 ——
  # README §5 的第一條防線就是假的。
  #
  # 刻意不在這裡碰 secret：萬一真的破功，也只是多一行無意義的 log，
  # 而不是把金鑰印進一個外人可以開 PR 觸發的 run。
  fork-marker:
    runs-on: ubuntu-latest
    steps:
      - run: echo "FORK_CONTROLLED_MARKER_9F3A2B"

  post:
    uses: tznthou/deepseek-code-review/.github/workflows/reusable-ai-review-post.yml@v1
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

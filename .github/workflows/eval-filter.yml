# 用 AACR-Bench 評估 review filter — 手動觸發，不會自己跑
#
# 為什麼要有這支：任何「自動刪掉某類 finding」的想法，上線前先用人工標註資料
# 量一次誤刪率。本 kit 曾經內建過一份 filter prompt，實測誤刪是刪對的 3.75 倍，
# 已經移除（見 README §8）——這支留下來是因為評估方法本身可重用。
#
# ⚠️ 不內建 prompt，要自己用 filter-prompt 指一份進來。
#
# 需要的 secret：DEEPSEEK_API_KEY（與 04 同一把）
#
# ⚠️ 會花 API 費用。全跑 140 個 PR 約 $0.5；先用 limit 試水溫。

name: eval filter (AACR-Bench)

on:
  workflow_dispatch:
    inputs:
      filter-prompt:
        description: 要評估的 filter prompt 檔案路徑（本 kit 不內建，需自備一份放進 repo）
        required: true
        type: string
      limit:
        description: 只跑前 N 個 PR（0 = 全部，約 140 個 / $0.5）
        required: false
        type: string
        default: '20'
      model:
        description: 模型
        required: false
        type: choice
        options: [deepseek-v4-pro, deepseek-flash]
        default: deepseek-v4-pro

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 建評估集（下載資料集 + 抓 PR diff）
        env:
          # build_eval_set.py 用 `gh api` 抓外部 public repo 的 diff
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVAL_LIMIT: ${{ inputs.limit }}
        run: python3 tools/eval/build_eval_set.py

      - name: 跑評估
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL: ${{ inputs.model }}
          FILTER_PROMPT: ${{ inputs.filter-prompt }}
        run: |
          # 值走 env 再由 shell 展開，不要把 expression 內插進 run block
          if [ ! -f "$FILTER_PROMPT" ]; then
            echo "::error::找不到 filter prompt：$FILTER_PROMPT（本 kit 不內建，需自備）"
            exit 1
          fi
          python3 tools/eval/eval_filter.py --model "$MODEL" --filter-prompt "$FILTER_PROMPT"

      - name: 上傳明細
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-result-${{ github.run_id }}
          path: |
            tools/eval/eval_result.json
            tools/eval/eval_set.json
          if-no-files-found: warn

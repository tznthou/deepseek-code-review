# 02 — CodeQL 靜態安全分析（SAST），結果以 SARIF 進 GitHub code scanning
#
# 與 01 的分工：01 是「風格/機密/依賴」，02 是「程式碼層級的漏洞資料流分析」。
# 每次 run 都會消耗 Actions minutes（private repo 另需 GitHub Code Security 授權）。

name: 02 codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1' # 每週一次全庫掃描（PR 只掃變更）

permissions:
  security-events: write # 上傳 SARIF 必需
  packages: read # 抓 CodeQL packs
  actions: read # private repo 需要
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [python] # 導入到別的 repo 時換成你的語言
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # 直譯式語言；編譯式語言改 autobuild 或手動步驟
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  # 第三方工具的 SARIF 走同一條路徑（例如 Trivy 掃容器/依賴）
  trivy:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
